# The existing SLURM controller/head node — source of truth for munge.key
# and the slurm.conf / cgroup.conf / etc. that get replicated to new nodes.
[slurm_controller]
slurmctl ansible_host=10.0.0.1 ansible_user=ubuntu

# Fresh Ubuntu node(s) to be turned into SLURM compute nodes.
# NOTE: each of these must already exist as a NodeName entry in the
# controller's slurm.conf (see README) before you run this playbook.
[compute_new]
node01 ansible_host=10.0.0.11 ansible_user=ubuntu
node02 ansible_host=10.0.0.12 ansible_user=ubuntu

[compute_new:vars]
ansible_python_interpreter=/usr/bin/python3
