---
# =============================================================================
# site.yml — Turn a fresh Ubuntu host into a SLURM compute node
#
# Run this FROM the SLURM controller (or any control machine that can SSH to
# both the controller and the new node). It:
#
#   Play 1  Pulls munge.key, slurm.conf (+ optional extra confs), and your
#           custom-built SLURM {{ slurm_version }} .deb packages off the
#           controller and stages them locally.
#   Play 2  Creates matching munge/slurm users first, then installs munge
#           (from apt) and SLURM (from the staged .deb packages — NOT apt,
#           since Ubuntu's repos only carry old LTS-packaged versions),
#           deploys the staged configs, and starts services.
#   Play 3  (optional) Tells slurmctld to reconfigure and shows node status.
#
# Prerequisites:
#   - The new node(s) must already appear as NodeName entries in slurm.conf
#     on the controller — this playbook copies slurm.conf as-is, it does
#     not edit it for you.
#   - slurm_deb_build_dir (group_vars/all.yml) must point at wherever your
#     dpkg-buildpackage / checkinstall run dropped the built .deb files on
#     the controller.
#
# Usage:
#   ansible-playbook site.yml
#   ansible-playbook site.yml --limit node01
#   ansible-playbook site.yml --skip-tags reconfigure
# =============================================================================

- name: Gather munge key, SLURM configs, and built .deb packages from the controller
  hosts: slurm_controller
  become: true
  gather_facts: false
  tasks:
    - name: Ensure local staging directories exist
      become: false
      delegate_to: localhost
      run_once: true
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0700"
      loop:
        - "{{ local_staging_dir }}"
        - "{{ local_staging_dir }}/debs"

    - name: Verify munge key exists on controller
      ansible.builtin.stat:
        path: "{{ munge_key_src }}"
      register: munge_key_stat

    - name: Fail if munge key is missing on controller
      ansible.builtin.fail:
        msg: >-
          munge key not found at {{ munge_key_src }} on {{ inventory_hostname }}.
          Check slurm_controller group / munge_key_src var.
      when: not munge_key_stat.stat.exists

    - name: Fetch munge key
      ansible.builtin.fetch:
        src: "{{ munge_key_src }}"
        dest: "{{ local_staging_dir }}/munge.key"
        flat: true
        mode: "0400"

    - name: Verify slurm.conf exists on controller
      ansible.builtin.stat:
        path: "{{ slurm_conf_src_dir }}/slurm.conf"
      register: slurm_conf_stat

    - name: Fail if slurm.conf is missing on controller
      ansible.builtin.fail:
        msg: >-
          slurm.conf not found at {{ slurm_conf_src_dir }}/slurm.conf on
          {{ inventory_hostname }}. Check slurm_conf_src_dir var.
      when: not slurm_conf_stat.stat.exists

    - name: Fetch slurm.conf
      ansible.builtin.fetch:
        src: "{{ slurm_conf_src_dir }}/slurm.conf"
        dest: "{{ local_staging_dir }}/slurm.conf"
        flat: true

    - name: Check which extra config files exist on controller
      ansible.builtin.stat:
        path: "{{ slurm_conf_src_dir }}/{{ item }}"
      loop: "{{ slurm_extra_conf_files }}"
      register: extra_conf_stats

    - name: Fetch extra config files that are present
      ansible.builtin.fetch:
        src: "{{ slurm_conf_src_dir }}/{{ item.item }}"
        dest: "{{ local_staging_dir }}/{{ item.item }}"
        flat: true
      loop: "{{ extra_conf_stats.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.stat.exists

    # -------------------------------------------------------------------
    # Custom-built SLURM {{ slurm_version }} .deb packages
    # -------------------------------------------------------------------
    - name: Find built SLURM .deb packages on controller
      ansible.builtin.find:
        paths: "{{ slurm_deb_build_dir }}"
        patterns: "{{ slurm_deb_include_patterns }}"
        excludes: "{{ slurm_deb_exclude_patterns }}"
        file_type: file
      register: slurm_deb_files

    - name: Fail if no SLURM .deb packages were found
      ansible.builtin.fail:
        msg: >-
          No SLURM .deb packages matching {{ slurm_deb_include_patterns }}
          found under {{ slurm_deb_build_dir }} on {{ inventory_hostname }}.
          Set slurm_deb_build_dir to wherever dpkg-buildpackage /
          checkinstall dropped your built {{ slurm_version }} packages.
      when: slurm_deb_files.matched == 0

    - name: Fetch SLURM .deb packages
      ansible.builtin.fetch:
        src: "{{ item.path }}"
        dest: "{{ local_staging_dir }}/debs/{{ item.path | basename }}"
        flat: true
      loop: "{{ slurm_deb_files.files }}"
      loop_control:
        label: "{{ item.path | basename }}"

# =============================================================================

- name: Configure fresh Ubuntu host as a SLURM compute node
  hosts: compute_new
  become: true
  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    # -------------------------------------------------------------------
    # Purge any old apt-installed SLURM packages (e.g. Ubuntu's stock
    # 21.08.5) before we install our own .deb-built version. Safe to run
    # against a genuinely fresh node too — package_facts just won't find
    # anything, so nothing below fires. This matters because:
    #   - our .deb build and Ubuntu's stock packages likely ship the same
    #     binary paths (/usr/sbin/slurmd etc.) under different package
    #     names, which dpkg will refuse to overwrite;
    #   - a running old slurmd would block the slurm user's UID change
    #     below the same way munge's did earlier.
    # -------------------------------------------------------------------
    - name: Gather installed package facts
      ansible.builtin.package_facts:
        manager: apt

    - name: Determine if any legacy apt SLURM packages are installed
      ansible.builtin.set_fact:
        legacy_slurm_installed: "{{ legacy_slurm_apt_packages | intersect(ansible_facts.packages.keys()) }}"

    - name: Stop slurmd before removing the old package
      ansible.builtin.systemd:
        name: slurmd
        state: stopped
      failed_when: false
      when: legacy_slurm_installed | length > 0

    - name: Purge legacy apt-installed SLURM packages
      ansible.builtin.apt:
        name: "{{ legacy_slurm_installed }}"
        state: absent
        purge: true
        autoremove: true
      when: legacy_slurm_installed | length > 0

    - name: Clear stale slurmd spool contents from the old install
      ansible.builtin.file:
        path: "{{ slurmd_spool_dir }}"
        state: absent
      when:
        - legacy_slurm_installed | length > 0
        - purge_stale_spool

    # -------------------------------------------------------------------
    # Create the munge/slurm users BEFORE installing any packages, with
    # the UID/GID pinned. Debian package post-install scripts check for
    # an existing user of the right name and skip creating their own —
    # so this way there's never a mismatched-UID window, no running
    # daemon holding the old UID, and no follow-up chown needed: each
    # package's own postinst sets up ownership against the account that
    # already exists.
    # -------------------------------------------------------------------
    - name: Ensure munge group exists with correct GID
      ansible.builtin.group:
        name: "{{ munge_group }}"
        gid: "{{ munge_gid }}"
        state: present
        system: true

    - name: Ensure munge user exists with correct UID
      ansible.builtin.user:
        name: "{{ munge_user }}"
        uid: "{{ munge_uid }}"
        group: "{{ munge_group }}"
        system: true
        shell: /usr/sbin/nologin
        home: /var/lib/munge
        create_home: false

    - name: Ensure slurm group exists with correct GID
      ansible.builtin.group:
        name: "{{ slurm_group }}"
        gid: "{{ slurm_gid }}"
        state: present
        system: true

    - name: Ensure slurm user exists with correct UID
      ansible.builtin.user:
        name: "{{ slurm_user }}"
        uid: "{{ slurm_uid }}"
        group: "{{ slurm_group }}"
        system: true
        shell: /usr/sbin/nologin
        home: /var/lib/slurm
        create_home: false

    # -------------------------------------------------------------------
    # munge — still a plain apt package, not a custom build
    # -------------------------------------------------------------------
    - name: Install munge packages
      ansible.builtin.apt:
        name: "{{ munge_packages }}"
        state: present

    # -------------------------------------------------------------------
    # SLURM {{ slurm_version }} — install from the .deb packages built on
    # the controller, NOT from apt (Ubuntu's repos only have old
    # LTS-packaged SLURM versions, e.g. 21.08.5, which won't speak the
    # wire protocol correctly against a {{ slurm_version }} controller).
    # -------------------------------------------------------------------
    - name: Ensure remote staging dir for SLURM .deb packages exists
      ansible.builtin.file:
        path: "{{ slurm_deb_remote_staging_dir }}"
        state: directory
        mode: "0755"

    - name: Copy built SLURM {{ slurm_version }} .deb packages to compute node
      ansible.builtin.copy:
        src: "{{ local_staging_dir }}/debs/"
        dest: "{{ slurm_deb_remote_staging_dir }}/"
        mode: "0644"
      register: slurm_deb_copy

    - name: Install SLURM {{ slurm_version }} from local .deb packages
      ansible.builtin.shell: apt-get install -y ./*.deb
      args:
        chdir: "{{ slurm_deb_remote_staging_dir }}"
      register: slurm_deb_install
      changed_when: "'Setting up' in slurm_deb_install.stdout or 'Unpacking' in slurm_deb_install.stdout"

    - name: Verify installed slurmd reports the expected version
      ansible.builtin.command: slurmd -V
      register: slurmd_version_check
      changed_when: false
      failed_when: slurm_version not in slurmd_version_check.stdout

    # -------------------------------------------------------------------
    # munge key
    # -------------------------------------------------------------------
    - name: Stop munge before replacing key
      ansible.builtin.systemd:
        name: munge
        state: stopped
      failed_when: false

    - name: Ensure /etc/munge directory permissions
      ansible.builtin.file:
        path: /etc/munge
        state: directory
        owner: "{{ munge_user }}"
        group: "{{ munge_group }}"
        mode: "0700"

    - name: Deploy munge key from controller
      ansible.builtin.copy:
        src: "{{ local_staging_dir }}/munge.key"
        dest: /etc/munge/munge.key
        owner: "{{ munge_user }}"
        group: "{{ munge_group }}"
        mode: "0400"
      notify: restart munge

    - name: Enable and start munge
      ansible.builtin.systemd:
        name: munge
        enabled: true
        state: started

    # -------------------------------------------------------------------
    # SLURM config + directories
    # -------------------------------------------------------------------
    - name: Ensure /etc/slurm directory exists
      ansible.builtin.file:
        path: "{{ slurm_conf_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Deploy slurm.conf from controller
      ansible.builtin.copy:
        src: "{{ local_staging_dir }}/slurm.conf"
        dest: "{{ slurm_conf_dir }}/slurm.conf"
        owner: root
        group: root
        mode: "0644"
      notify: restart slurmd

    - name: Check which extra config files were staged locally
      ansible.builtin.stat:
        path: "{{ local_staging_dir }}/{{ item }}"
      loop: "{{ slurm_extra_conf_files }}"
      delegate_to: localhost
      become: false
      register: staged_extra_confs
      loop_control:
        label: "{{ item }}"

    - name: Deploy extra config files that were staged
      ansible.builtin.copy:
        src: "{{ local_staging_dir }}/{{ item.item }}"
        dest: "{{ slurm_conf_dir }}/{{ item.item }}"
        owner: root
        group: root
        mode: "0644"
      loop: "{{ staged_extra_confs.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.stat.exists
      notify: restart slurmd

    - name: Ensure slurmd spool directory exists
      ansible.builtin.file:
        path: "{{ slurmd_spool_dir }}"
        state: directory
        owner: "{{ slurm_user }}"
        group: "{{ slurm_group }}"
        mode: "0755"

    - name: Ensure slurm log directory exists
      ansible.builtin.file:
        path: "{{ slurmd_log_dir }}"
        state: directory
        owner: "{{ slurm_user }}"
        group: "{{ slurm_group }}"
        mode: "0755"

    # -------------------------------------------------------------------
    # Firewall
    # -------------------------------------------------------------------
    - name: Allow slurmd port through ufw
      community.general.ufw:
        rule: allow
        port: "{{ slurmd_port }}"
        proto: tcp
      when: open_firewall
      failed_when: false

    # -------------------------------------------------------------------
    # Start slurmd
    # -------------------------------------------------------------------
    - name: Enable and start slurmd
      ansible.builtin.systemd:
        name: slurmd
        enabled: true
        state: started

    - name: Verify munge authentication works locally
      ansible.builtin.shell: munge -n | unmunge
      register: munge_test
      changed_when: false
      failed_when: "'Success' not in munge_test.stdout"

  handlers:
    - name: restart munge
      ansible.builtin.systemd:
        name: munge
        state: restarted

    - name: restart slurmd
      ansible.builtin.systemd:
        name: slurmd
        state: restarted

# =============================================================================

- name: Reconfigure controller and verify new node(s)
  hosts: slurm_controller
  become: true
  gather_facts: false
  tags: [reconfigure]
  tasks:
    - name: Tell slurmctld to reconfigure
      ansible.builtin.command: scontrol reconfigure
      changed_when: true

    - name: Show current node status
      ansible.builtin.command: sinfo -N -l
      register: sinfo_out
      changed_when: false

    - name: Display node status
      ansible.builtin.debug:
        var: sinfo_out.stdout_lines
